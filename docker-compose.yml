# ============================================================================
# Crypto Intelligence Terminal – production stack (Step 1.1)
#
#   timescaledb       PostgreSQL 15 + TimescaleDB hypertables
#   redis             Redis 7 (AOF persistence) – pub/sub bus + cache
#   backend-api       FastAPI gateway (uvicorn workers)
#   analytics-worker  Celery (asyncio pool) + market & social ingestion
#   frontend          Next.js production build (standalone output)
#
#   docker compose --env-file .env up --build
# ============================================================================
name: crypto-intel-terminal

x-backend-env: &backend-env
  POSTGRES_HOST: timescaledb
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-crypto}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
  POSTGRES_DB: ${POSTGRES_DB:-crypto_intel}
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SYMBOLS: ${SYMBOLS:-BTC,ETH,SOL,BNB,XRP,DOGE,ADA}
  QUOTE_ASSET: ${QUOTE_ASSET:-USDT}
  EXCHANGE_ID: ${EXCHANGE_ID:-binance}
  TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
  REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
  REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
  REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-crypto-intel-terminal/1.0}
  SENTIMENT_MODEL_ID: ${SENTIMENT_MODEL_ID:-cardiffnlp/twitter-roberta-base-sentiment-latest}
  NLP_DEVICE: ${NLP_DEVICE:-cpu}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}

services:
  # ------------------------------------------------------------------ storage
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: crypto-intel-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_intel}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto} -d ${POSTGRES_DB:-crypto_intel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: crypto-intel-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ------------------------------------------------------------------- api
  backend-api:
    build:
      context: ./backend
      args:
        PROFILE: api
    container_name: crypto-intel-api
    command: ["api"]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_WORKERS: ${API_WORKERS:-2}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8000:8000"

  # --------------------------------------------------------------- workers
  analytics-worker:
    build:
      context: ./backend
      args:
        PROFILE: worker
    container_name: crypto-intel-worker
    command: ["worker"]
    environment:
      <<: *backend-env
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-16}
      MARKET_FEED_RESOLUTION: ${MARKET_FEED_RESOLUTION:-1m}
      DERIVATIVE_POLL_SECONDS: ${DERIVATIVE_POLL_SECONDS:-60}
      SOCIAL_POLL_SECONDS: ${SOCIAL_POLL_SECONDS:-90}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - hf_cache:/root/.cache/huggingface

  # -------------------------------------------------------------- frontend
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: crypto-intel-frontend
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  timescaledb_data:
  redis_data:
  hf_cache:
